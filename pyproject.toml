[project]
name = "radar"
version = "0.1.0"
description = "Radar tecnológico: detección de inflexiones en ciencia y patentes"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
