# Dominio de foco. Reemplaza "agricultura regenerativa" (práctica poco patentable).
# 2026-10-21: agricultura_precision sale del foco; su parte de riego pasa a agua/riego_eficiencia.
# CPC validado contra 2026.08 (ADR F0-g). Topics resueltos en el spike F0-c (2026-10-19).
domain: agrobiotech
name: Biotech de cultivos
version: "0.5"
thesis: >
  Edición génica sin transgénesis (marcos regulatorios NGT), presión sobre
  agroquímicos y fertilizantes nitrogenados, y caída de costos de secuenciación
  habilitan biológicos y cultivos editados.

frentes:
  - id: edicion_genica_vegetal
    name: Edición génica en plantas
    rule: cpc+keyword
    cpc_any: ["C12N15/82", "A01H1/00", "A01H6"]  # C12N15/82 ya incluye 8201, 8213...
    cpc_qualified:
      # Cas (C12N9/222) e índice CRISPR (C12N2310/20) solo en contexto vegetal
      - codes: ["C12N9/222", "C12N2310/20"]
        with_any: ["C12N15/82", "A01H"]
    keywords_any: ["CRISPR", "Cas9", "Cas12", "base editing", "prime editing", "genome editing"]
    science:
      rule: topic+keyword  # el topic CRISPR incluye edición humana y animal
      topics:
        - {id: T10878, name: CRISPR and Genetic Engineering}
        - {id: T12828, name: Plant Genetic and Mutation Studies}
      keyword_groups:
        - [CRISPR, "genome editing", "gene editing", "base editing", "prime editing"]
        - [plant, crop, rice, wheat, maize, soybean, tomato]

  - id: biopesticidas
    name: Biocontrol y biopesticidas
    rule: cpc
    # A01N63: microorganismos, virus, ácidos nucleicos; A01N65: algas y extractos vegetales.
    # Se quitó A01P (actividad de cualquier pesticida, incluidos los químicos).
    cpc_any: ["A01N63", "A01N65"]
    science:
      # el topic incluye taxonomía de hongos; brecha: no hay topic para biocontrol de
      # patógenos vegetales
      rule: topic+keyword
      topics:
        - {id: T11436, name: Entomopathogenic Microorganisms in Pest Control}
      keywords_any: [biocontrol, "biological control", biopesticide, bioinsecticide, pest,
                     formulation, crop]

  - id: bioestimulantes_fijacion_n
    name: Bioestimulantes y fijación biológica de N
    rule: cpc+keyword
    # C05F11/08 fertilizantes con cultivos bacterianos; C05F11/10 con hormonas vegetales.
    # Se quitó C05G3/60 (biocidas en fertilizantes, no bioestimulantes). No existe un código
    # CPC específico de bioestimulantes: las keywords hacen el trabajo.
    cpc_any: ["C05F11/08", "C05F11/10", "A01N63", "C12N1/20", "C12R2001"]
    keywords_any: ["biostimulant", "nitrogen-fixing", "plant growth-promoting", "PGPR",
                   "rhizobacteria"]
    science:
      rule: topic+keyword  # T10076 es amplio (inmunidad planta-microbio)
      topics:
        - {id: T12407, name: Plant Growth Enhancement Techniques}
        - {id: T10076, name: Plant-Microbe Interactions and Immunity}
      keywords_any: [biostimulant, "plant growth-promoting", PGPR, rhizobacteria,
                     "nitrogen-fixing", biofertilizer, "nitrogen fixation"]

  - id: rnai_spray
    name: RNAi tópico (dsRNA)
    rule: cpc+keyword
    # A01N63/60 = biocidas con ácidos nucleicos aislados (el código del dsRNA en spray);
    # A01N57/16 (fosforados heterocíclicos) no correspondía
    cpc_any: ["A01N63/60", "C12N15/113", "C12N2310/14"]
    keyword_groups:  # AND entre grupos, OR dentro de cada grupo
      - ["dsRNA", "RNAi", "double-stranded RNA"]
      - ["plant", "crop", "pest", "spray"]
    science:
      rule: keyword  # no hay topic específico
      keyword_groups:
        - [dsRNA, "double-stranded RNA"]
        # evals 2026-10-21: "pest" traía RNAi transgénico y estudios de función génica
        - [spray, sprayable, topical, exogenous, "foliar application", SIGS, "spray-induced",
           "crop protection"]

lenses: [all, international]
min_families_per_period: 30
