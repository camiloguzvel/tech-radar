# Hubs para asignar instituciones (OpenAlex geo) por radio haversine.
# `countries` es obligatorio y separa hubs vecinos (Shenzhen CN vs Hong Kong HK).
# Si varios centros cubren un punto, gana el más cercano. Coordenadas = centro urbano.
version: "0.1"
hubs:
  - id: bay_area
    name: Silicon Valley / Bay Area
    countries: [US]
    centers:
      - {name: San Francisco, lat: 37.7749, lon: -122.4194, radius_km: 50}
      - {name: San José, lat: 37.3382, lon: -121.8863, radius_km: 50}
