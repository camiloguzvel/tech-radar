# Dominio piloto. Los símbolos CPC tienen formato válido; su existencia y alcance
# están validados contra el esquema CPC 2026.08 (ADR F0-g); cada código incluye sus subgrupos.
# Bloque `science`: topics de OpenAlex resueltos en el spike F0-c (2026-10-19).
domain: agua
name: Gestión y tecnologías del agua
version: "0.6"
thesis: >
  Regulación de contaminantes emergentes (PFAS), escasez hídrica y reutilización
  industrial (semiconductores, data centers) empujan tratamiento avanzado y
  fuentes no convencionales.

frentes:
  - id: pfas_remocion
    name: Remoción/destrucción de PFAS
    rule: cpc+keyword  # el CPC solo es demasiado amplio
    cpc_any: ["C02F1/28", "C02F1/44", "C02F1/461", "C02F1/72", "B01J20", "A62D3"]
    keywords_any: ["PFAS", "perfluoro", "polyfluoro", "PFOA", "PFOS"]
    science:
      rule: topic+keyword  # el topic incluye toxicología y exposición, no solo remoción
      topics:
        - {id: T11869, name: Per- and polyfluoroalkyl substances research}
      # evals 2026-10-21: "degradation" y "treatment" traían toxicología y destino ambiental
      keywords_any: [removal, adsorption, destruction, remediation, defluorination, sorbent,
                     "water treatment", "treatment technology"]
      # evals 2026-10-21 (2.ª ronda): el resumen menciona el tratamiento de pasada en estudios de
      # riesgo, monitoreo y ecotoxicología; se exige un término de tratamiento en el título
      title_keywords_any: [removal, remove, adsorption, sorption, sorbent, destruction,
                           degradation, defluorination, treatment, remediation, membrane,
                           oxidation, electrochemical, "ion exchange", incineration, plasma,
                           sonochemical, photocatalytic, "foam fractionation"]

  - id: desalinizacion_membranas
    name: Desalinización y membranas
    rule: cpc
    cpc_any: ["C02F1/44", "C02F1/469"]  # tratamiento de agua por membranas/electrodiálisis
    cpc_qualified:
      # membranas genéricas (gases, alimentos, biofármacos) solo con tratamiento de agua
      - codes: ["B01D61/02", "B01D61/14", "B01D61/36", "B01D69", "B01D71"]
        with_any: ["C02F"]
    science:
      rule: topic+keyword  # el topic incluye membranas para alimentos y bioprocesos
      topics:
        - {id: T10197, name: Membrane Separation Technologies}
        - {id: T12074, name: Membrane-based Ion Separation Techniques}
      keywords_any: [desalination, seawater, brackish, "reverse osmosis", "forward osmosis",
                     brine, "capacitive deionization", "drinking water", wastewater]

  - id: agua_atmosferica
    name: Captación de agua atmosférica
    rule: cpc|keyword
    cpc_any: ["E03B3/28"]  # agua desde aire húmedo; B01D53/26 (secado de gases) era demasiado amplio
    # "metal-organic framework" solo sería demasiado amplio (MOFs para gases, catálisis)
    keywords_any: ["atmospheric water", "water harvesting", "water from air"]
    science:
      rule: keyword  # no hay topic específico (el más cercano es purificación solar)
      keywords_any: ["atmospheric water harvesting", "water harvesting from air",
                     "atmospheric water generation", "fog harvesting"]

  - id: reutilizacion_avanzada
    name: Reutilización y oxidación avanzada
    rule: cpc
    # oxidación (incluye ozono C02F1/78, peróxidos C02F1/722, catalítica C02F1/725) y UV;
    # se quitaron los índices genéricos C02F2101/30 y C02F2103/34 (cualquier tratamiento)
    cpc_any: ["C02F1/72", "C02F1/32"]
    science:
      rule: topic+keyword  # T11781 incluye saneamiento rural y estudios sociales
      topics:
        - {id: T10210, name: Advanced oxidation water treatment}
        - {id: T11781, name: Wastewater Treatment and Reuse}
      keywords_any: [reuse, reclaimed, reclamation, "advanced oxidation", ozonation,
                     persulfate, peroxymonosulfate, photocatalytic, "Fenton"]

  - id: redes_inteligentes
    name: Monitoreo y redes inteligentes de agua
    rule: cpc|keyword
    cpc_any: ["E03B7/07", "G01N33/18"]
    cpc_qualified:
      # detección de fugas en tuberías solo en redes de agua o alcantarillado (no gas ni cables)
      - codes: ["G01M3/28"]
        with_any: ["E03B", "E03F"]
    # "leak detection" a secas trae fugas de gas: se exige contexto de agua
    keywords_any: ["water leak", "water network", "smart water", "water distribution network"]
    science:
      rule: topic+keyword  # los topics incluyen hidroeléctricas y acuicultura
      topics:
        - {id: T11220, name: Water Systems and Optimization}
        - {id: T12697, name: Water Quality Monitoring Technologies}
      keyword_groups:
        - ["water distribution", "water supply", "water network", pipeline, pipe, "drinking water"]
        - [leak, leakage, sensor, monitoring, smart, "digital twin", burst, "real-time"]

  - id: riego_eficiencia
    name: Riego de precisión y eficiencia hídrica
    rule: cpc|keyword
    cpc_any: ["A01G25/16", "A01G25/02", "A01G25/06"]  # control de riego, goteo, riego subterráneo
    keywords_any: ["precision irrigation", "smart irrigation", "deficit irrigation",
                   "irrigation scheduling", "variable rate irrigation"]
    science:
      rule: topic+keyword  # T11404 cubre prácticas de riego en general
      topics:
        - {id: T11404, name: Irrigation Practices and Water Management}
      keywords_any: ["deficit irrigation", "drip irrigation", "precision irrigation",
                     "smart irrigation", "irrigation scheduling", "variable rate irrigation",
                     "water productivity", "water use efficiency", "subsurface irrigation",
                     "soil moisture sensor"]

exclude:
  cpc_only_if_alone: ["C02F2201", "C02F2209"]  # códigos auxiliares de indexación
  keywords_any: ["ballast water"]

lenses: [all, international]
min_families_per_period: 30
